# === Server ===
server.port=8080

# === Datasource (MySQL) ===
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# === JWT Configuration ===
jwt.secret=YourSecretKeyForJWTGeneration1234567890
jwt.expirationMs=3600000   # 1 hour in milliseconds

# === Spring Security ===
spring.security.user.name=admin
spring.security.user.password=adminpassword
spring.security.user.roles=ADMIN

# === Swagger / OpenAPI ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# === Logging ===
logging.level.org.springframework.web=INFO
logging.level.com.haze.hrms=DEBUG
